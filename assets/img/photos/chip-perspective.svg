<title id="chipTitle">A microfluidic organ-on-chip device</title>
<desc id="chipDesc">A transparent chip seen at an angle. A channel network is etched into the top face, running from four ports to a central culture chamber, and filled with illuminated fluid. Metal tubing rises from each port.</desc>
