<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="chipTitle chipDesc">
  <title id="chipTitle">Cross-section of a two-compartment organ-on-chip device</title>
  <desc id="chipDesc">A transparent microfluidic chip with inlet and outlet tubing. A layer of tissue lines the upper channel, a perfused channel carrying microbes runs below, and a porous membrane between them lets molecules cross from one to the other.</desc>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#1CC0CE" stop-opacity="0.62"/>
      <stop offset="45%" stop-color="#0D7885" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#05171C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFF4F8" stop-opacity="0.26"/>
      <stop offset="45%" stop-color="#7FD4DC" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#4FA9B4" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="22%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="78%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tissue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F49CC2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#B8477A" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="perfusate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2FB5D8" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#4FE0F2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2FB5D8" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDF5F7"/>
      <stop offset="50%" stop-color="#A6BAC3"/>
      <stop offset="100%" stop-color="#637A85"/>
    </linearGradient>
    <marker id="flowPale" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#B6EDF2" fill-opacity="0.75"/>
    </marker>
    <marker id="flowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#6BD8EE" fill-opacity="0.9"/>
    </marker>
    <marker id="flowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#A6F0CB"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#05171C"/>
  <rect width="800" height="400" fill="url(#glow)"/>

  <!-- inlet and outlet tubing -->
  <g stroke="url(#tube)" stroke-width="13" stroke-linecap="round" fill="none">
    <line x1="8" y1="163" x2="76" y2="163"/>
    <line x1="8" y1="239" x2="76" y2="239"/>
    <line x1="724" y1="163" x2="792" y2="163"/>
    <line x1="724" y1="239" x2="792" y2="239"/>
  </g>
  <g stroke="#F2F9FA" stroke-width="2.2" stroke-linecap="round" opacity="0.45" fill="none">
    <line x1="16" y1="159" x2="68" y2="159"/>
    <line x1="16" y1="235" x2="68" y2="235"/>
    <line x1="732" y1="159" x2="784" y2="159"/>
    <line x1="732" y1="235" x2="784" y2="235"/>
  </g>
  <g fill="#93A9B2">
    <rect x="56" y="149" width="24" height="28" rx="5"/>
    <rect x="56" y="225" width="24" height="28" rx="5"/>
    <rect x="720" y="149" width="24" height="28" rx="5"/>
    <rect x="720" y="225" width="24" height="28" rx="5"/>
  </g>

  <ellipse cx="400" cy="320" rx="285" ry="15" fill="#2FB5D8" opacity="0.10"/>

  <!-- chip body -->
  <rect x="70" y="100" width="660" height="200" rx="20" fill="none" stroke="#3FBACB" stroke-width="10" stroke-opacity="0.13"/>
  <rect x="70" y="100" width="660" height="200" rx="20" fill="url(#glass)" stroke="#9BE6EE" stroke-width="2.4" stroke-opacity="0.9"/>
  <path d="M92 112 H708" stroke="url(#sheen)" stroke-width="3" stroke-linecap="round"/>

  <!-- channels -->
  <rect x="100" y="128" width="600" height="70" rx="9" fill="#0B2E37" stroke="#6CC4D0" stroke-width="1.3" stroke-opacity="0.5"/>
  <rect x="100" y="206" width="600" height="66" rx="9" fill="#08232B"/>
  <rect x="100" y="206" width="600" height="66" rx="9" fill="url(#perfusate)" stroke="#6CC4D0" stroke-width="1.3" stroke-opacity="0.55"/>

  <!-- channel necks joining the ports to the chambers -->
  <g stroke="#6CC4D0" stroke-width="7" stroke-opacity="0.32" stroke-linecap="round" fill="none">
    <line x1="82" y1="163" x2="104" y2="163"/>
    <line x1="82" y1="239" x2="104" y2="239"/>
    <line x1="696" y1="163" x2="718" y2="163"/>
    <line x1="696" y1="239" x2="718" y2="239"/>
  </g>

  <!-- media flowing over the tissue -->
  <g stroke="#B6EDF2" stroke-width="2.4" stroke-opacity="0.7" stroke-linecap="round" fill="none">
    <line x1="140" y1="144" x2="210" y2="144" marker-end="url(#flowPale)"/>
    <line x1="330" y1="144" x2="400" y2="144" marker-end="url(#flowPale)"/>
    <line x1="520" y1="144" x2="590" y2="144" marker-end="url(#flowPale)"/>
  </g>

  <!-- confluent tissue layer lining the membrane -->
  <path d="M106 202
    A 24.5 40 0 0 1 155 202 A 24.5 34 0 0 1 204 202 A 24.5 42 0 0 1 253 202
    A 24.5 36 0 0 1 302 202 A 24.5 41 0 0 1 351 202 A 24.5 33 0 0 1 400 202
    A 24.5 42 0 0 1 449 202 A 24.5 37 0 0 1 498 202 A 24.5 40 0 0 1 547 202
    A 24.5 35 0 0 1 596 202 A 24.5 39 0 0 1 645 202 A 24.5 36 0 0 1 694 202 Z"
    fill="url(#tissue)" stroke="#FBC2D8" stroke-width="2.1" stroke-opacity="0.95" stroke-linejoin="round"/>
  <g fill="#FFE6F0" fill-opacity="0.68">
    <circle cx="130.5" cy="184.0" r="5"/>
    <circle cx="179.5" cy="186.7" r="4.6"/>
    <circle cx="228.5" cy="183.1" r="5.2"/>
    <circle cx="277.5" cy="185.8" r="4.8"/>
    <circle cx="326.5" cy="183.6" r="5.1"/>
    <circle cx="375.5" cy="187.2" r="4.5"/>
    <circle cx="424.5" cy="183.1" r="5.2"/>
    <circle cx="473.5" cy="185.3" r="4.8"/>
    <circle cx="522.5" cy="184.0" r="5"/>
    <circle cx="571.5" cy="186.2" r="4.7"/>
    <circle cx="620.5" cy="184.5" r="4.9"/>
    <circle cx="669.5" cy="185.8" r="4.8"/>
  </g>

  <!-- porous membrane -->
  <line x1="100" y1="202" x2="700" y2="202" stroke="#B6EDF2" stroke-width="2.6" stroke-dasharray="9 6" stroke-opacity="0.9"/>

  <!-- molecules crossing the membrane into the tissue -->
  <g stroke="#A6F0CB" stroke-width="2.2" stroke-opacity="0.9" stroke-dasharray="4 4" fill="none">
    <line x1="253" y1="224" x2="253" y2="186" marker-end="url(#flowGreen)"/>
    <line x1="498" y1="224" x2="498" y2="186" marker-end="url(#flowGreen)"/>
  </g>

  <!-- microbes in the perfused channel -->
  <g fill="#92EABB" fill-opacity="0.9">
    <ellipse cx="150" cy="222" rx="8.5" ry="3.5" transform="rotate(-18 150 222)"/>
    <ellipse cx="225" cy="258" rx="8.5" ry="3.5" transform="rotate(10 225 258)"/>
    <ellipse cx="310" cy="221" rx="8.5" ry="3.5" transform="rotate(7 310 221)"/>
    <ellipse cx="385" cy="259" rx="8.5" ry="3.5" transform="rotate(-14 385 259)"/>
    <ellipse cx="455" cy="222" rx="8.5" ry="3.5" transform="rotate(20 455 222)"/>
    <ellipse cx="545" cy="257" rx="8.5" ry="3.5" transform="rotate(-6 545 257)"/>
    <ellipse cx="630" cy="223" rx="8.5" ry="3.5" transform="rotate(14 630 223)"/>
    <ellipse cx="672" cy="258" rx="8.5" ry="3.5" transform="rotate(-10 672 258)"/>
  </g>

  <!-- perfusion through the lower channel -->
  <g stroke="#6BD8EE" stroke-width="2.6" stroke-opacity="0.85" stroke-linecap="round" fill="none">
    <line x1="120" y1="240" x2="196" y2="240" marker-end="url(#flowBlue)"/>
    <line x1="280" y1="240" x2="356" y2="240" marker-end="url(#flowBlue)"/>
    <line x1="440" y1="240" x2="516" y2="240" marker-end="url(#flowBlue)"/>
    <line x1="600" y1="240" x2="676" y2="240" marker-end="url(#flowBlue)"/>
  </g>
</svg>
